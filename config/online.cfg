# MultiHero online settings (copied into the game data by tools/prep_assets.py).
# A copy named online.cfg in the browser's save folder overrides this file.
#
# backend:  auto   = "worker" when server is a web address (https://...), otherwise "demo"
#           worker = Cloudflare Worker relay (github.com/richardyusan/multihero-server),
#                    rooms are joined with a code - web version only
#           demo   = offline simulation (fake rooms and bots) - works without internet
#           relay  = TCP lobby server on a VPS (Android/Linux only)
#           eos    = Epic Online Services P2P (needs the EOS SDK)
backend = auto

# online server: the Cloudflare Worker (WebSocket rooms at <server>/room/<CODE>)
server = https://multihero-server.multihero-web.workers.dev
port = 7777

# player name shown in rooms (empty = random "player1234", remembered in the browser;
# it can be changed with the "name" button above the lobby)
name =

# Epic Online Services (backend = eos)
eos_product_id =
eos_sandbox_id =
eos_deployment_id =
eos_client_id =
eos_client_secret =
